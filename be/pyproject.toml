[project]
name = "sekilas-be"
version = "0.1.0"
description = "Sekilas backend: API, simulasi agen, dasbor analitik, RAG"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "arq>=0.26",
    "httpx>=0.27",
    "numpy>=2.0",
    "statsmodels>=0.14",
    "salib>=1.5",
    "anthropic>=0.40",
    "google-genai>=0.3",
    "langfuse>=2.50",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
